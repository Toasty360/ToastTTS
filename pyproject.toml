[project]
name = "toast-tts"
version = "0.1.0"
description = "Natural-pacing, low-latency streaming layer for on-device TTS (Piper)"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["toast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
